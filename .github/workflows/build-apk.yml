name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Export debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_TAG: "4.4.1-stable"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest"

      - name: Install OS deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip curl ca-certificates libfontconfig1 libgl1

      - name: Download Godot 4.4.1
        run: |
          set -euo pipefail
          curl -L --retry 5 --retry-delay 4 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Android export templates
        run: |
          set -euo pipefail
          curl -L --retry 5 --retry-delay 4 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${TEMPLATE_DIR}"
          unzip -o /tmp/templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "${TEMPLATE_DIR}/"
          ls -lh "${TEMPLATE_DIR}" | head -40
          test -f "${TEMPLATE_DIR}/android_debug.apk"

      - name: Create debug keystore
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.android"
          if [ ! -f "${HOME}/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${HOME}/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh "${HOME}/.android/debug.keystore"

      - name: Configure Godot editor settings (Android SDK + keystore)
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
            echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
            echo "export/android/debug_keystore = \"${HOME}/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/force_system_user = false'
            echo 'export/android/shutdown_adb_on_exit = true'
          } > "${HOME}/.config/godot/editor_settings-4.tres"
          cat "${HOME}/.config/godot/editor_settings-4.tres"

      - name: Import project
        run: |
          set -euo pipefail
          mkdir -p build/android
          # Import only — avoid --editor which can hang headless on CI
          timeout 180 godot --headless --path . --import --quit || true
          test -d .godot

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          timeout 300 godot --headless --path . --verbose --export-debug "Android" "build/android/CarSimulator-debug.apk"
          ls -lh build/android/
          test -f build/android/CarSimulator-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-simulator-android-apk
          path: build/android/*.apk
          if-no-files-found: error
          retention-days: 30
